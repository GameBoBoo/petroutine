services:
  web:
    build: .
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://pawroutine:pawroutine@db:5432/pawroutine
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before running Docker Compose}
      PAWROUTINE_AI_ENABLED: ${PAWROUTINE_AI_ENABLED:-false}
      PAWROUTINE_AI_HOURLY_LIMIT: ${PAWROUTINE_AI_HOURLY_LIMIT:-10}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
    ports:
      - "127.0.0.1:${PAWROUTINE_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pawroutine
      POSTGRES_PASSWORD: pawroutine
      POSTGRES_DB: pawroutine
    volumes:
      - pawroutine-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawroutine -d pawroutine"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pawroutine-postgres:
