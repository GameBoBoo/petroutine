services:
  web:
    image: ${DELIVERY_IMAGE:-pawroutine-delivery:local}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://pawroutine:${DELIVERY_DB_PASSWORD:?Set DELIVERY_DB_PASSWORD}@db:5432/pawroutine
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      PAWROUTINE_AI_ENABLED: "false"
    ports:
      - "${DELIVERY_BIND_ADDRESS:-127.0.0.1}:${DELIVERY_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(async r=>{const b=await r.json();if(!r.ok||b.database!=='ok')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pawroutine
      POSTGRES_PASSWORD: ${DELIVERY_DB_PASSWORD:?Set DELIVERY_DB_PASSWORD}
      POSTGRES_DB: pawroutine
    volumes:
      - delivery-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawroutine -d pawroutine"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped
volumes:
  delivery-postgres:
